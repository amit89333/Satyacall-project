name: satyacall
description: "SatyaCall — Real-time on-device call scam & AI voice clone detection system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  record: ^5.1.2
  permission_handler: ^11.3.1
  flutter_overlay_window: ^0.4.5
  http: ^1.2.1
  flutter_local_notifications: ^17.1.2
  vibration: ^2.0.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
